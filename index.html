<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIN Finder Pro</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #141417;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent: #2997ff;
            --border: rgba(255, 255, 255, 0.08);
            --success: #30d158;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 2rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem 1.2rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(41, 151, 255, 0.2);
        }

        input[type="text"]::placeholder {
            color: #555;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-result {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .card-result:hover {
            background: #1c1c20;
            transform: translateY(-2px);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .bank-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .card-type {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: inline-block;
        }

        .bin-number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 0.2rem;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .copy-btn.copied {
            background: var(--success);
            color: #000;
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BIN Finder</h1>
            <p class="subtitle">Búsqueda en tiempo real para tarjetas chilenas</p>
        </header>

        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Ej: Santander, Tenpo, Débito..." autocomplete="off">
        </div>

        <div id="resultsContainer" class="results">
            <!-- Los resultados se inyectarán aquí -->
        </div>
    </div>

    <script>
        // Base de datos extendida (Banca tradicional, Retail y Fintechs)
        const binDatabase = [
            // Fintech / Prepago
            { bank: "Tenpo", type: "Mastercard Prepago", bin: "538776" },
            { bank: "MACH (BCI)", type: "Visa Prepago", bin: "477432" },
            { bank: "Mercado Pago", type: "Mastercard Prepago", bin: "536655" },
            { bank: "Tapp (Caja Los Andes)", type: "Mastercard Prepago", bin: "522000" },
            { bank: "Los Héroes", type: "Mastercard Prepago", bin: "535160" },
            { bank: "Coopeuch", type: "Mastercard Prepago", bin: "531391" },

            // Banco de Chile
            { bank: "Banco de Chile", type: "Visa Crédito", bin: "450942" },
            { bank: "Banco de Chile", type: "Mastercard Crédito", bin: "543419" },
            { bank: "Banco de Chile", type: "Visa Débito", bin: "491374" },
            { bank: "Banco de Chile / Edwards", type: "Visa Crédito", bin: "455243" },

            // Santander
            { bank: "Banco Santander", type: "Mastercard Crédito", bin: "558254" },
            { bank: "Banco Santander", type: "Visa Crédito", bin: "404010" },
            { bank: "Banco Santander", type: "Visa Débito", bin: "488050" },
            { bank: "Banco Santander", type: "Mastercard Débito", bin: "546001" },

            // Banco Estado
            { bank: "Banco Estado", type: "Mastercard Débito (CuentaRUT)", bin: "527837" },
            { bank: "Banco Estado", type: "Visa Crédito", bin: "461623" },
            { bank: "Banco Estado", type: "Mastercard Crédito", bin: "540201" },

            // BCI
            { bank: "Banco BCI", type: "Visa Crédito", bin: "411802" },
            { bank: "Banco BCI", type: "Mastercard Crédito", bin: "548545" },
            { bank: "Banco BCI", type: "Visa Débito", bin: "421671" },

            // Falabella
            { bank: "Banco Falabella", type: "Mastercard Crédito", bin: "517679" },
            { bank: "Banco Falabella", type: "Mastercard Débito", bin: "518413" },
            { bank: "Banco Falabella", type: "Visa Crédito", bin: "415011" },

            // Scotiabank & Cencosud
            { bank: "Banco Scotiabank", type: "Visa Crédito", bin: "422003" },
            { bank: "Banco Scotiabank", type: "Mastercard Crédito", bin: "548177" },
            { bank: "Banco Scotiabank", type: "Visa Débito", bin: "635460" },
            { bank: "Cencosud Scotiabank", type: "Mastercard Crédito", bin: "536648" },
            { bank: "Cencosud Scotiabank", type: "Visa Crédito", bin: "421528" },

            // Itaú
            { bank: "Banco Itaú", type: "Visa Crédito", bin: "460411" },
            { bank: "Banco Itaú", type: "Mastercard Crédito", bin: "526210" },
            { bank: "Banco Itaú", type: "Visa Débito", bin: "494578" },

            // Ripley
            { bank: "Banco Ripley", type: "Visa Crédito", bin: "446776" },
            { bank: "Banco Ripley", type: "Mastercard Crédito", bin: "544062" },

            // Otros Retail y Bancos
            { bank: "Lider BCI", type: "Mastercard Crédito", bin: "546412" },
            { bank: "Consorcio", type: "Visa Crédito", bin: "435210" },
            { bank: "Banco Security", type: "Visa Crédito", bin: "425142" },
            { bank: "Banco BICE", type: "Visa Crédito", bin: "441011" }
        ];

        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');

        // Función para renderizar los resultados
        function renderResults(data) {
            resultsContainer.innerHTML = '';

            if (data.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">No se encontraron BINs para esta búsqueda.</div>';
                return;
            }

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card-result';
                
                card.innerHTML = `
                    <div class="card-info">
                        <span class="bank-name">${item.bank}</span>
                        <span class="card-type">${item.type}</span>
                        <span class="bin-number" id="bin-${index}">${item.bin}</span>
                    </div>
                    <button class="copy-btn" onclick="copyToClipboard('${item.bin}', this)">Copiar</button>
                `;
                resultsContainer.appendChild(card);
            });
        }

        // Búsqueda en tiempo real
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            if (searchTerm === '') {
                renderResults(binDatabase); // Muestra todos si está vacío
                return;
            }

            const filteredData = binDatabase.filter(item => 
                item.bank.toLowerCase().includes(searchTerm) || 
                item.type.toLowerCase().includes(searchTerm) ||
                item.bin.includes(searchTerm)
            );

            renderResults(filteredData);
        });

        // Función de copiado con feedback visual
        function copyToClipboard(text, buttonElement) {
            navigator.clipboard.writeText(text).then(() => {
                // Estado original
                const originalText = buttonElement.innerText;
                
                // Cambiar a estado de éxito
                buttonElement.innerText = '¡Copiado!';
                buttonElement.classList.add('copied');

                // Restaurar después de 1.5s
                setTimeout(() => {
                    buttonElement.innerText = originalText;
                    buttonElement.classList.remove('copied');
                }, 1500);
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }

        // Renderizar todos los BINs al cargar la página
        window.onload = () => {
            renderResults(binDatabase);
        };
    </script>
</body>
</html>
